name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          ref: 'Integration'

      - name: Manually Fetch Core Components
        run: |
          rm -rf moonlight-common X1Kit
          git clone --depth 1 https://github.com moonlight-common
          git clone --depth 1 https://github.com X1Kit

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -project VoidLink.xcodeproj \
                     -scheme Limelight \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/Limelight.app Payload/
          zip -r VoidLink.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-Unsigned-IPA
          path: VoidLink.ipa
